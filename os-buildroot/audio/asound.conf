# Install only on a Brain using the experimental BU26154 module.
pcm.brain_playback {
    type plug
    slave {
        pcm "hw:CARD=BrainBU26154,DEV=0"
        format S16_LE
        rate 44100
        channels 2
    }
}

# The mono ADC occupies the left slot; do not average it with the empty right.
pcm.brain_capture_slots {
    type route
    slave {
        pcm "hw:CARD=BrainBU26154,DEV=1"
        channels 2
    }
    ttable.0.0 1
}
pcm.brain_capture {
    type plug
    slave {
        pcm "brain_capture_slots"
        format S16_LE
        rate 44100
        channels 1
    }
}
pcm.!default {
    type asym
    playback.pcm "brain_playback"
    capture.pcm "brain_capture"
}
ctl.!default {
    type hw
    card "BrainBU26154"
}
